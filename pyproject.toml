# ---------------------------------------------------------------------------
# CreatorPilot — Python project configuration (shared foundation)
#
# Runtime dependencies are intentionally empty. Each module owner adds what
# their module needs on their own branch, pinned at that point, so this file
# never pre-commits the team to a stack nobody has evaluated yet.
#
# The importable package is `app`, sourced from `backend/`:
#     pip install -e ".[dev]"   ->   import app.features ...
# ---------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creatorpilot"
version = "0.1.0"
description = "CreatorPilot — Creator Intelligence OS backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CreatorPilot team" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

# --- Packaging: `backend/` is the source root, `app/` is the package -------
[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

# --- Ruff -----------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- Mypy -----------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["backend/app"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

# --- Pytest ---------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
